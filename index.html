<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eurontuotteet.fi - Peliareena</title>
  <style>
    :root {
      --primary: #d9232e;
      --primary-dark: #b01a23;
      --bg-color: #f4f6f8;
      --nav-bg: #ffffff;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Yläpalkki ja navigointi */
    header {
      background-color: var(--nav-bg);
      border-bottom: 2px solid #e5e5e5;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      z-index: 10;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background-color: transparent;
      color: var(--text-color);
      border: 2px solid #e0e0e0;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .nav-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Peliruudun säiliö */
    main {
      flex: 1;
      width: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Eurontuotteet.fi</span> Peliareena
    </div>
    <nav class="nav-buttons">
      <button class="nav-btn active" onclick="loadGame('muistipeli.html', this)">Muistipeli</button>
      <button class="nav-btn" onclick="loadGame('onnenpyora.html', this)">Onnenpyörä</button>
      <button class="nav-btn" onclick="loadGame('tuoteselain.html', this)">Tuoteselain</button>
    </nav>
  </header>

  <main>
    <iframe id="game-frame" src="muistipeli.html" title="Eurontuotteet Pelit"></iframe>
  </main>

  <script>
    function loadGame(pageUrl, button) {
      // Vaihdetaan iframen lähde
      document.getElementById('game-frame').src = pageUrl;

      // Päivitetään aktiivisen painikkeen tyyli
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }
  </script>

</body>
</html>
